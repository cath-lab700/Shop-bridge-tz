/* Layout concept: one phone-width column, sticky top bar with language switch, four-tab bottom bar.
   Sell tab holds three sub-views: store dashboard, product manager with photos, join form.
   Store cards carry a dotted woven banner in their own hue; the commission split is drawn as a two-colour bar. */
:root{
  --bg:#EDF3F2; --surface:#FFFFFF; --surface-2:#F4F8F7; --ink:#0E2A33; --muted:#566C74; --line:#D3DFDD;
  --brand:#0A6C74; --on-brand:#FFFFFF; --pop:#F2B01E; --on-pop:#2A1D00;
  --good:#1B8553; --on-good:#FFFFFF; --bad:#B8362A; --overlay:rgb(8 24 30 / .55);
  --thumb-l:90%; --thumb-fg-l:26%;
  --veil-top:rgb(237 243 242 / .88); --veil-bot:rgb(237 243 242 / .68); --glass:rgb(237 243 242 / .70); --glass-bar:rgb(255 255 255 / .84);
  --muted-photo:#3F545C;
  --shadow:0 1px 2px rgb(14 42 51 / .08), 0 6px 18px rgb(14 42 51 / .07);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:10px; --r-m:14px; --r-l:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A191E; --surface:#112329; --surface-2:#0E1E24; --ink:#E4EFED; --muted:#8FA6AB; --line:#223E46;
    --brand:#3CB9C2; --on-brand:#04242A; --pop:#F4BB35; --on-pop:#2A1D00;
    --good:#4DC58B; --on-good:#06261A; --bad:#F27B6E; --overlay:rgb(0 0 0 / .65);
    --thumb-l:22%; --thumb-fg-l:80%;
    --veil-top:rgb(10 25 30 / .88); --veil-bot:rgb(10 25 30 / .78); --glass:rgb(10 25 30 / .72); --glass-bar:rgb(17 35 41 / .86);
  --muted-photo:#B2C5C9;
    --shadow:0 1px 2px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A191E; --surface:#112329; --surface-2:#0E1E24; --ink:#E4EFED; --muted:#8FA6AB; --line:#223E46;
  --brand:#3CB9C2; --on-brand:#04242A; --pop:#F4BB35; --on-pop:#2A1D00;
  --good:#4DC58B; --on-good:#06261A; --bad:#F27B6E; --overlay:rgb(0 0 0 / .65);

  --shadow:0 1px 2px rgb(0 0 0 / .35);

}

body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--font-body); -webkit-text-size-adjust:100%;
  padding-block:0 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:10}
.app{max-width:480px;margin:0 auto}
#view{display:block;padding-top:8px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.08;font-weight:800}
h2{font-size:21px;line-height:1.15;font-weight:800}
h3{font-size:17px;line-height:1.2;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.lead{color:var(--muted-photo);max-width:44ch}
.stack>.muted{color:var(--muted-photo)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 0 0 100vmax var(--glass);clip-path:inset(0 -100vmax);
}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:42px;height:42px;flex:none;filter:drop-shadow(0 2px 3px rgb(10 60 66 / .22))}
.brand-name{font:700 clamp(21px,6.6vw,25px)/1 "Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.brand-name b{font-weight:inherit;color:var(--brand)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.lang button{border:0;background:none;min-width:44px;min-height:36px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* generic blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);padding:16px}
.tag{display:inline-block;background:var(--pop);color:var(--on-pop);font:700 11px var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.tag.plain{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.intro{display:flex;flex-direction:column;gap:10px;padding-block:6px 4px;align-items:flex-start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:0;border-radius:var(--r-m);background:var(--brand);color:var(--on-brand);font:700 16px var(--font-body);cursor:pointer;width:100%}
.btn.small{width:auto;min-height:40px;padding:0 16px;font-size:14px;border-radius:999px}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--glass-bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--brand);font-weight:700;min-height:44px;padding:0 16px 0 10px;border-radius:999px;cursor:pointer;align-self:flex-start;margin-top:4px}
.back svg{width:18px;height:18px}

/* search + chips */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:14px}
input[type=text],input[type=search],input[type=tel],input[type=number],select,textarea{
  width:100%;min-height:50px;padding:10px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);font-size:16px
}
textarea{min-height:92px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* store cards */
.store{display:block;width:100%;text-align:left;border:0;padding:0;background:var(--surface);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.banner{
  height:88px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px 14px;color:#fff;
  background-color:hsl(var(--h) 46% 32%);
  background-image:radial-gradient(circle,rgb(255 255 255 / .17) 0 2.5px,transparent 3px),radial-gradient(circle,rgb(255 255 255 / .1) 0 2.5px,transparent 3px);
  background-size:18px 18px;background-position:0 0,9px 9px;
}
.banner{position:relative}
.banner::after{content:"";position:absolute;left:0;right:0;top:100%;height:7px;z-index:1;pointer-events:none;

.phone input{border:0;border-radius:0;min-width:0}
.phone:focus-within{border-color:var(--brand)}

.lines{overflow-wrap:anywhere}

/* sell tab: sub-navigation, dashboard, product manager */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}

.prod-top{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center}

.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}

/* pickup, delivery and WhatsApp */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.opt span{font-size:13px;color:var(--muted);font-weight:500}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.opt[aria-checked="true"] span{color:inherit;opacity:.85}
.kv .sub{font-size:13px}
.kv .sub dt{padding-left:12px}
a.btn{text-decoration:none}
.btn.wa{background:var(--good);color:var(--on-good);gap:10px}
.wa-row{display:flex;flex-wrap:wrap;gap:8px}
.wa-row .btn.wa{flex:1 1 180px;width:auto}
.fine{font-size:13px;color:var(--muted)}

/* store settings */
.settings summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.settings summary::-webkit-details-marker{display:none}
.settings summary::after{content:"";flex:none;width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-right:4px}
.settings[open] summary::after{transform:rotate(-135deg)}
.settings summary small{display:block;margin-top:2px}
.settings[open] summary{margin-bottom:14px}
.settings .body{display:flex;flex-direction:column;gap:16px}

}

/* pilot footer note */
.pilot-note{color:var(--muted-photo);text-align:center;padding:6px 8px 0}
/* column wrappers: plain stacks on phones */
.store-cols,.cart-cols,.join-cols,.dash-cols{display:flex;flex-direction:column;gap:14px}
.aside-lines{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* tablets: wider column, two store cards across */
@media (min-width:640px){

}

}

/* photos */
function photoSrc(key){
  if(PILOT_IMG[key])return PILOT_IMG[key];
  if(state.local[key])return state.local[key];
  var id=state.photos[key];
  return (typeof id==='string'&&RE_ASSET.test(id))?'/_blob/'+id:'';
}
function thumbHtml(s,i){
  var key=s.id+'|'+i.id,src=photoSrc(key),letter=esc(itemName(i).charAt(0));
  return '<div class="thumb" style="--h:'+s.h+'" aria-hidden="true">'+(src?'<img class="pimg" src="'+src+'" alt="" loading="lazy" data-letter="'+letter+'">':letter)+'</div>';
}
function stripHtml(s){
  var out=[];
  for(var i=0;i<s.items.length&&out.length<3;i++){
    var src=photoSrc(s.id+'|'+s.items[i].id);
    if(src)out.push('<span class="sp"><img class="pimg" src="'+src+'" alt="" loading="lazy" data-letter=""></span>');
  }
  return out.length?'<div class="strip" aria-hidden="true">'+out.join('')+'</div>':'';
}
document.addEventListener('error',function(e){
  var n=e.target;
  if(!n||n.tagName!=='IMG'||!n.classList.contains('pimg'))return;
  var p=n.parentNode;if(!p)return;
  if(p.classList.contains('sp'))p.remove();
  else if(p.classList.contains('thumb'))p.textContent=n.dataset.letter||'';
  else if(p.classList.contains('photo-box'))p.innerHTML=ICON.camera;
},true);

function resizeImage(file){
  return new Promise(function(resolve,reject){
    if(!file||!/^image\//.test(file.type||''))return reject(new Error('type'));
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight;
      if(!w||!h){URL.revokeObjectURL(url);return reject(new Error('size'));}
      var k=Math.min(1,720/Math.max(w,h)),cw=Math.round(w*k),ch=Math.round(h*k);
      var c=document.createElement('canvas');c.width=cw;c.height=ch;
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?resolve(b):reject(new Error('encode'));},'image/jpeg',0.8);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('load'));};
    img.src=url;
  });
}

/* catalogue persistence: db holds the catalogue, assets hold the photos */
var cloud={ref:null,assets:null,canWrite:false};
var saving=false,dirty=false;

function setSync(k){
  state.sync=k;
  var n=el('sync');
  if(n){n.textContent=t('sync_'+k);n.className='sync '+k;}
}
function buildDoc(){
  var stores=[],products={};
  STORES.forEach(function(s){
    if(s.custom)stores.push({id:s.id,name:s.name,cat:s.cat,area:s.area||'',net:s.net||'',phone:s.phone||''});
    var mine=[];
    s.items.forEach(function(i){if(i.c)mine.push({id:i.id,en:i.en,sw:i.sw,p:i.p});});
    if(mine.length)products[s.id]=mine;
  });
  return {v:1,stores:stores,products:products,edits:state.edits,photos:state.photos,soldout:state.soldout,settings:state.settings};
}
function applyDoc(d){
  if(!d||typeof d!=='object')return;
  var stores=cloneSeeds();
  (Array.isArray(d.stores)?d.stores:[]).slice(0,20).forEach(function(x){
    if(!x||typeof x.id!=='string'||!RE_SID.test(x.id))return;
    if(stores.some(function(s){return s.id===x.id;}))return;
    var name=cleanStr(x.name,60).trim();if(!name)return;
    stores.push({id:x.id,name:name,cat:CATS.indexOf(x.cat)>-1?x.cat:'general',h:hueOf(name),km:null,
      area:cleanStr(x.area,60).trim(),items:[],custom:true,
      net:netName(x.net)?x.net:'',phone:/^\d{9}$/.test(String(x.phone))?String(x.phone):''});
  });
  var prods=(d.products&&typeof d.products==='object')?d.products:{};
  stores.forEach(function(s){
    var arr=prods[s.id];if(!Array.isArray(arr))return;
    arr.slice(0,60).forEach(function(x){
      if(!x||typeof x.id!=='string'||!RE_PID.test(x.id))return;
      if(s.items.some(function(i){return i.id===x.id;}))return;
      var en=cleanStr(x.en,60).trim(),p=Math.round(Number(x.p));
      if(!en||!(p>0)||p>10000000)return;
      s.items.push({id:x.id,en:en,sw:cleanStr(x.sw,60).trim()||en,p:p,c:true});
    });
  });
  var edits={};
  if(d.edits&&typeof d.edits==='object'){
    Object.keys(d.edits).slice(0,200).forEach(function(key){
      var parts=key.split('|'),s=stores.filter(function(z){return z.id===parts[0];})[0],it=findItem(s,parts[1]),x=d.edits[key];
      if(!s||!it||it.c||!x||typeof x!=='object')return;
      var en=cleanStr(x.en,60).trim(),p=Math.round(Number(x.p));
      if(!en||!(p>0)||p>10000000)return;
      it.en=en;it.sw=cleanStr(x.sw,60).trim()||en;it.p=p;
      edits[key]={en:it.en,sw:it.sw,p:it.p};
    });
  }
  var photos={};
  if(d.photos&&typeof d.photos==='object'){
    Object.keys(d.photos).slice(0,500).forEach(function(key){
      var id=d.photos[key];
      if(typeof id==='string'&&RE_ASSET.test(id))photos[key]=id;
    });
  }
  var soldout={};
  if(d.soldout&&typeof d.soldout==='object'){
    Object.keys(d.soldout).slice(0,500).forEach(function(key){if(d.soldout[key])soldout[key]=1;});
  }
  var settings={};
  if(d.settings&&typeof d.settings==='object'){
    stores.forEach(function(s){
      var x=d.settings[s.id];if(!x||typeof x!=='object')return;
      var o={};
      if(typeof x.wa==='string'&&/^[67]\d{8}$/.test(x.wa))o.wa=x.wa;
      var f=Number(x.fee);
      if(x.fee!==undefined&&x.fee!==null&&x.fee!==''&&isFinite(f)&&f>=0&&f<=50000)o.fee=Math.round(f);
      if(o.wa||o.fee!==undefined)settings[s.id]=o;
    });
  }
  STORES=stores;state.settings=settings;state.edits=edits;state.photos=photos;state.soldout=soldout;
}
function persist(){
  if(!cloud.ref){setSync('local');return;}
  if(!cloud.canWrite){setSync('view');return;}
  dirty=true;
  if(!saving)flush();
}
function flush(){
  if(!dirty)return;
  dirty=false;saving=true;setSync('saving');
  cloud.ref.set(buildDoc()).then(function(){
    saving=false;
    if(dirty)flush();else setSync('saved');
  },function(err){
    saving=false;
    if(err&&err.code==='invalid_argument'){cloud.canWrite=false;setSync('view');}
    else setSync('error');
  });
}
function use(n){
  try{return Promise.resolve(window.claude.use(n)).then(function(x){return x||null;},function(){return null;});}
  catch(e){return Promise.resolve(null);}
}
function initCloud(){
  if(!HAS_CLAUDE)return;
  Promise.all([use('db'),use('assets'),use('user')]).then(function(r){
    var db=r[0],user=r[2];
    cloud.assets=r[1];
    if(!db){setSync('local');return;}
    var canP=(user&&typeof user.can==='function')
      ?Promise.resolve(user.can('data.write')).then(function(v){return v!==false;},function(){return true;})
      :Promise.resolve(true);
    return canP.then(function(ok){
      var ref=db.doc('shop/catalogue');
      return ref.get().then(function(snap){
        cloud.ref=ref;cloud.canWrite=ok;
        if(snap.exists)applyDoc(snap.data());
        for(var i=0;i<STORES.length;i++){if(STORES[i].custom){state.mgr=STORES[i].id;break;}}
        state.sync=ok?'ready':'view';
        render();
      });
    });
  }).catch(function(){setSync('local');});
}

/* cart helpers */
function cartQty(sid,pid){return state.cart[sid+'|'+pid]||0;}
function setQty(sid,pid,q){var k=sid+'|'+pid;if(q<=0)delete state.cart[k];else state.cart[k]=q;}
function cartGroups(){
  var out=[];
  STORES.forEach(function(s){
    var lines=[],sub=0;
    s.items.forEach(function(i){
      var q=cartQty(s.id,i.id);
      if(q>0&&!isSold(s.id,i.id)){lines.push({item:i,qty:q});sub+=q*i.p;}
    });
    if(lines.length)out.push({store:s,lines:lines,subtotal:sub});
  });
  return out;
}
function totalQty(){return cartGroups().reduce(function(a,g){return a+g.lines.reduce(function(b,l){return b+l.qty;},0);},0);}
function totalAmt(){return cartGroups().reduce(function(a,g){return a+g.subtotal;},0);}

/* orders */
function mkOrder(id,sid,buyer,pairs,status){
  var s=byId(sid),lines=[],gross=0;
  pairs.forEach(function(p){
    var it=findItem(s,p[0]);
    lines.push({pid:it.id,qty:p[1],price:it.p,en:it.en,sw:it.sw});gross+=it.p*p[1];
  });
  var sp=splitAmount(gross,RATE);
  return {id:id,sid:sid,buyer:buyer,lines:lines,gross:gross,commission:sp.commission,payout:sp.payout,status:status,net:'mpesa',sample:true};
}

function storeCard(s){

    '<div class="banner" style="--h:'+s.h+'"><span class="banner-cat">'+t('cat_'+s.cat)+'</span>'+stripHtml(s)+'</div>'+
    '<div class="store-body"><div><h3>'+esc(s.name)+'</h3><p class="muted num">'+t('products',{n:s.items.length})+' · '+away(s)+'</p></div>'+ICON.next+'</div></button>';

function storeList(){
  var q=state.q.trim().toLowerCase();
  var list=STORES.filter(function(s){
    if(!s.items.length)return false;
    if(state.cat!=='all'&&s.cat!==state.cat)return false;
    if(!q)return true;
    if(s.name.toLowerCase().indexOf(q)>-1)return true;
    return s.items.some(function(i){return (i.en+' '+i.sw).toLowerCase().indexOf(q)>-1;});
  });
  if(!list.length)return '<p class="empty-line">'+t('noMatch')+'</p>';
  return list.map(storeCard).join('');
}

/* order cards, shared by the buyer's Orders tab and the store dashboard */
var STATUS_KEYS=['placed','confirmed','onway','received'];
function pilotOrderCard(o){
  var s=byId(o.sid),fee=o.fee||0,total=o.gross+fee;
  var lines=o.lines.map(function(l){return l.qty+' × '+lineName(l);}).join(', ');
  return '<article class="card order"><div class="order-head"><div><p class="ref">'+esc(o.id)+'</p><h3>'+esc(s?s.name:(o.store||''))+'</h3></div><span class="pill s0">'+t('st_placed')+'</span></div>'+
    '<p class="muted lines">'+esc(lines)+'</p>'+(o.ful?'<p class="muted lines">'+esc(fulText(o))+'</p>':'')+
    '<dl class="kv"><div class="strong"><dt>'+t('payStoreP')+'</dt><dd>'+fmt(total)+'</dd></div>'+(fee?'<div class="sub"><dt>'+t('feeIncl')+'</dt><dd>'+fmt(fee)+'</dd></div>':'')+'</dl>'+waBlock(o)+'</article>';
}
function orderCard(o,mode){
  if(PILOT)return pilotOrderCard(o);
  var s=byId(o.sid),store=(mode==='store'),fee=o.fee||0,total=o.gross+fee;
  var lines=o.lines.map(function(l){return l.qty+' × '+lineName(l);}).join(', ');
  var title=store?(o.buyer==='you'?t('youTest'):esc(o.buyer)):esc(s?s.name:'');
  var feeRow=fee?'<div><dt>'+t(store?'deliveryFee':'feeIncl')+'</dt><dd>'+fmt(fee)+'</dd></div>':'';
  var kv=store
    ?'<div><dt>'+t('orderTotal')+'</dt><dd>'+fmt(total)+'</dd></div>'+feeRow+'<div><dt>'+t('commission',{rate:RATE})+'</dt><dd>'+fmt(o.commission)+'</dd></div><div class="strong"><dt>'+t('youReceive')+'</dt><dd>'+fmt(o.payout)+'</dd></div>'
    :'<div><dt>'+t('paid')+'</dt><dd>'+fmt(total)+'</dd></div>'+feeRow+'<div><dt>'+t('commission',{rate:RATE})+'</dt><dd>'+fmt(o.commission)+'</dd></div><div class="strong"><dt>'+t('payout')+'</dt><dd>'+fmt(o.payout)+'</dd></div>';
  var action='';
  if(store){
    if(o.status===0)action='<button type="button" class="btn" data-act="order-next" data-oid="'+o.id+'">'+t('act_confirm')+'</button>';
    else if(o.status===1)action='<button type="button" class="btn" data-act="order-next" data-oid="'+o.id+'">'+t('act_onway')+'</button>';
    else if(o.status===2)action='<p class="payout-note">'+t('act_wait')+'</p>';
    else action='<p class="payout-note rel">'+t('payoutReleased')+'</p>';
  }else{
    if(o.status<2)action='<p class="payout-note">'+t('waitStore')+' · '+t('payoutHeld')+'</p><button type="button" class="btn ghost" data-act="act-store" data-sid="'+o.sid+'">'+t('actAsStore')+'</button>';
    else if(o.status===2)action='<p class="payout-note">'+t('payoutHeld')+'</p><button type="button" class="btn" data-act="received" data-oid="'+o.id+'">'+t('iReceived')+'</button>';
    else action='<p class="payout-note rel">'+t('payoutReleased')+'</p>';
  }
  var info='';
  if(o.ful)info+='<p class="muted lines">'+esc(fulText(o))+'</p>';
  if(store&&(o.name||o.phone))info+='<p class="muted lines">'+esc([o.name,o.phone?phoneShow(o.phone):''].filter(Boolean).join(' · '))+'</p>';
  var wa=store
    ?(o.phone?'<a class="btn small ghost" href="'+esc(waUrl(waToBuyerText(o),'255'+o.phone))+'" target="_blank" rel="noopener">'+t('waBuyer')+'</a>':'')
    :waBlock(o);
  return '<article class="card order">'+
    '<div class="order-head"><div><p class="ref">'+o.id+'</p><h3>'+title+'</h3></div><span class="pill s'+o.status+'">'+t('st_'+STATUS_KEYS[o.status])+'</span></div>'+
    '<p class="muted lines">'+esc(lines)+'</p>'+info+
    '<ol class="steps">'+STATUS_KEYS.map(function(k,i){return '<li class="'+(i<=o.status?'done':'')+'"><i></i><span>'+t('st_'+k)+'</span></li>';}).join('')+'</ol>'+
    '<div class="split"><i style="width:'+(total?(o.payout/total*100).toFixed(2):100)+'%"></i><i></i></div>'+
    '<dl class="kv">'+kv+'</dl>'+wa+action+'</article>';
}

  var mine=state.orders.filter(function(o){return o.buyer==='you';}).sort(function(a,b){return ordNum(b)-ordNum(a);});

      return o?'<a class="btn wa" href="'+esc(waUrl(waText(o),waNum(o.sid)))+'" target="_blank" rel="noopener">'+WA_ICON+t('waSend',{store:esc(s?s.name:'')})+'</a>':'';
    }).join('');
    body='<div class="ok-mark">'+ICON.check+'</div><h2>'+t(PILOT?'okTitleP':'okTitle')+'</h2><p>'+t(PILOT?'okBodyP':'okBody',{n:p.count})+'</p><p class="fine">'+(directAll(p.ids)?t('waIntroDirect'):t('waIntro'))+'</p>'+
      '<div class="sheet-actions">'+links+'<button type="button" class="btn ghost" data-act="view-orders">'+t('viewOrders')+'</button></div>';
  }else{
    body='<div class="ok-mark bad">'+ICON.cross+'</div><h2>'+t('failTitle')+'</h2><p>'+t('failBody')+'</p>'+
      '<div class="sheet-actions"><button type="button" class="btn" data-act="retry">'+t('tryAgain')+'</button><button type="button" class="btn ghost" data-act="close-sheet">'+t('close')+'</button></div>';
  }
  box.hidden=false;
  box.innerHTML='<div class="panel">'+body+'</div>';
  var first=box.querySelector('button');
  if(first)first.focus();
}

/* shell */
var VIEWS={shop:shopView,store:storeView,cart:cartView,checkout:checkoutView,orders:ordersView,sell:sellView};
var TABS=[
  {id:'shop',icon:ICON.shop,views:['shop','store']},
  {id:'cart',icon:ICON.cart,views:['cart','checkout']},
  {id:'orders',icon:ICON.orders,views:['orders']},
  {id:'sell',icon:ICON.sell,views:['sell']}
];
function tabsHtml(){
  var n=totalQty();
  return TABS.map(function(tb){
    var on=tb.views.indexOf(state.view)>-1;
    return '<button type="button" class="tab" data-act="tab" data-tab="'+tb.id+'"'+(on?' aria-current="page"':'')+'>'+tb.icon+
      '<span>'+t('tab_'+tb.id)+'</span>'+(tb.id==='cart'&&n?'<span class="badge num">'+n+'</span>':'')+'</button>';
  }).join('');
}
var lastKey=null;
function render(){
  var v=state.view,key=v+(v==='sell'?':'+state.sellTab:'');
  document.documentElement.lang=state.lang;
  el('view').innerHTML=VIEWS[v]();
  el('tabs').innerHTML=tabsHtml();
  el('langEn').setAttribute('aria-pressed',String(state.lang==='en'));
  el('langSw').setAttribute('aria-pressed',String(state.lang==='sw'));
  renderSheet();
  if(v==='sell'&&state.sellTab==='join')updateCalc();
  if(key!==lastKey){window.scrollTo(0,0);lastKey=key;}
  if(state.focusId){var f=el(state.focusId);if(f)f.focus();state.focusId=null;}
}
function go(v){state.view=v;render();}

function placeOrders(){
  var groups=cartGroups(),n=0,ids=[],del=state.ful==='delivery';
  groups.forEach(function(g){
    var sp=splitAmount(g.subtotal,RATE),fee=del?feeFor(g.store):0,id='SB-'+(state.seq++);
    state.orders.push({
      id:id,sid:g.store.id,store:g.store.name,buyer:'you',
      lines:g.lines.map(function(l){return {pid:l.item.id,qty:l.qty,price:l.item.p,en:l.item.en,sw:l.item.sw};}),
      gross:g.subtotal,fee:fee,commission:sp.commission,payout:sp.payout+fee,status:0,net:state.pay.net,
      ful:del?'delivery':'pickup',area:del?state.area.trim().slice(0,80):'',landmark:del?state.landmark.trim().slice(0,80):'',
      name:state.bName.trim().slice(0,40),phone:state.pay.phone
    });
    ids.push(id);n++;
  });
  state.cart={};
  state.pay.count=n;state.pay.ids=ids;
  saveOrders();
}

/* catalogue editing */
function attachPhoto(key,blob){
  state.local[key]=URL.createObjectURL(blob);
  render();
  if(cloud.ref&&cloud.canWrite&&cloud.assets){
    cloud.assets.upload(blob,{type:'image/jpeg'}).then(function(r){
      state.photos[key]=r.id;persist();toast(t('photoSaved'));
    },function(){toast(t('photoLocal'));});
  }else toast(t('photoLocal'));
}
function dropPhoto(key){delete state.photos[key];delete state.local[key];}
function dropProductData(sid,pid){
  var key=sid+'|'+pid;
  dropPhoto(key);delete state.soldout[key];delete state.edits[key];delete state.cart[key];
}
function openEditor(sid,pid){
  var s=byId(sid),it=pid?findItem(s,pid):null;
  state.edit={sid:sid,pid:pid||null,en:it?it.en:'',sw:it&&it.sw!==it.en?it.sw:'',price:it?String(it.p):'',photo:null,removePhoto:false,err:{}};
  state.focusId='e-en';
  render();
}
function saveEdit(){
  var e=state.edit;if(!e)return;
  var s=byId(e.sid);if(!s){state.edit=null;render();return;}
  var en=String(e.en).trim().slice(0,60),sw=String(e.sw).trim().slice(0,60),p=parsePrice(e.price),err={};
  if(!en)err.en=t('needName');
  if(!p)err.p=t('needPrice');
  if(err.en||err.p){e.err=err;render();state.focusId=err.en?'e-en':'e-p';var f=el(state.focusId);if(f)f.focus();state.focusId=null;return;}
  var it=e.pid?findItem(s,e.pid):null;
  if(it){
    it.en=en;it.sw=sw||en;it.p=p;
    if(!it.c)state.edits[s.id+'|'+it.id]={en:it.en,sw:it.sw,p:it.p};
  }else{
    it={id:rid('p'),en:en,sw:sw||en,p:p,c:true};
    s.items.push(it);
  }
  var key=s.id+'|'+it.id,ph=e.photo,rm=e.removePhoto;
  state.edit=null;
  if(rm&&!ph)dropPhoto(key);
  persist();
  if(ph)attachPhoto(key,ph.blob);else{render();toast(t('toastSaved'));}
}
function createStore(){
  var a=state.applied,f=state.form;
  if(!a)return;
  var name=a.store.slice(0,60);
  var s={id:rid('u'),name:name,cat:f.cat,h:hueOf(name),km:null,area:String(f.area).trim().slice(0,60),items:[],custom:true,net:f.net,phone:a.phone};
  STORES.push(s);
  if(a.wa)state.settings[s.id]={wa:a.wa};
  state.mgr=s.id;state.sellTab='products';state.applied=null;
  state.form={store:'',owner:'',phone:'',net:'mpesa',cat:'general',area:'',about:'',wa:'',agree:false};
  persist();
  state.edit=null;
  openEditor(s.id,null);
}
function removeStore(m){
  if(!m||!m.custom)return;
  m.items.forEach(function(i){dropProductData(m.id,i.id);});
  STORES=STORES.filter(function(s){return s.id!==m.id;});
  state.orders=state.orders.filter(function(o){return o.sid!==m.id;});
  delete state.withdrawn[m.id];delete state.settings[m.id];
  if(state.storeId===m.id)state.storeId=null;
  state.mgr='neema';state.edit=null;
  persist();render();toast(t('toastRemoved'));
}

/* events */
var MUTATING={'add-product':1,'edit-product':1,'stock':1,'del-product':1,'remove-store':1,'open-dash':1,'pick-quick':1,'pick-editor':1,'save-settings':1};
var photoFor=null;
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b)return;
  var d=b.dataset;
  if(d.act!=='del-product'&&d.act!=='remove-store')state.confirm=null;
  if(MUTATING[d.act]&&state.sync==='checking'){toast(t('sync_checking'));return;}
  switch(d.act){
    case 'lang':
      state.lang=d.lang;
      try{localStorage.setItem('sb-lang',d.lang);}catch(err){}
      render();break;
    case 'tab':go(d.tab);break;
    case 'cat':state.cat=d.cat;render();break;
    case 'open-store':state.storeId=d.store;go('store');break;
    case 'back':go('shop');break;
    case 'inc':setQty(d.sid,d.pid,cartQty(d.sid,d.pid)+1);render();break;
    case 'dec':setQty(d.sid,d.pid,cartQty(d.sid,d.pid)-1);render();break;
    case 'to-checkout':if(totalQty()>0){state.phoneErr=false;go('checkout');}break;
    case 'to-cart':go('cart');break;
    case 'net':state.net=d.net;render();break;
    case 'pay':{
      var p=normalizePhone(state.phone),needArea=state.ful==='delivery'&&!state.area.trim();
      state.phoneErr=!p;state.areaErr=needArea;
      if(!p||needArea){render();var bad=el(needArea?'b-area':'phone');if(bad)bad.focus();break;}
      if(PILOT){state.pay={phone:p,net:'',amount:payTotal()};placeOrders();state.pay.stage='ok';render();break;}
      state.pay={stage:'wait',phone:p,net:state.net,amount:payTotal()};
      renderSheet();break;
    }
    case 'sim-approve':placeOrders();state.pay.stage='ok';render();break;
    case 'sim-cancel':state.pay.stage='fail';renderSheet();break;
    case 'retry':state.pay.stage='wait';renderSheet();break;
    case 'close-sheet':state.pay={stage:null};renderSheet();break;
    case 'view-orders':state.pay={stage:null};go('orders');break;
    case 'save-settings':{
      var ssm=mgrStore(),ssw=String((el('s-wa')||{}).value||''),ssf=String((el('s-fee')||{}).value||'').trim();
      var ssn=ssw.trim()?normalizePhone(ssw):'',ssnum=ssf===''?null:Number(ssf),sse={};
      if(ssw.trim()&&!ssn)sse.wa=true;
      if(ssf!==''&&!(isFinite(ssnum)&&ssnum>=0&&ssnum<=50000))sse.fee=true;
      if(sse.wa||sse.fee){
        state.setErr=sse;state.setDraft={sid:ssm.id,wa:ssw,fee:ssf};render();
        var ssel=el(sse.wa?'s-wa':'s-fee');if(ssel)ssel.focus();break;
      }
      var sst={};if(ssn)sst.wa=ssn;if(ssnum!==null)sst.fee=Math.round(ssnum);
      if(sst.wa||sst.fee!==undefined)state.settings[ssm.id]=sst;else delete state.settings[ssm.id];
      state.setErr=null;state.setDraft=null;persist();render();toast(t('toastSettings'));break;
    }
    case 'ful':state.ful=d.ful;state.areaErr=false;render();break;
    case 'copy-msg':{
      var co=orderById(d.oid),txt=co?waText(co):'';
      var okc=function(){toast(t('copied'));},nop=function(){toast(t('copyFail'));};
      try{navigator.clipboard.writeText(txt).then(okc,nop);}catch(cerr){nop();}
      break;
    }
    case 'order-next':
      state.orders.forEach(function(o){if(o.id===d.oid&&o.status<2)o.status++;});
      render();break;
    case 'received':
      state.orders.forEach(function(o){if(o.id===d.oid&&o.status===2)o.status=3;});
      render();break;
    case 'act-store':state.mgr=d.sid;state.sellTab='dash';state.edit=null;go('sell');break;
    case 'subtab':state.sellTab=d.sub;state.view='sell';render();break;
    case 'withdraw':{
      var m=mgrStore(),mo=moneyFor(ordersFor(m.id),state.withdrawn[m.id]||0);
      if(mo.avail>0){
        state.withdrawn[m.id]=(state.withdrawn[m.id]||0)+mo.avail;
        var dest=(m.net&&m.phone)?(netName(m.net)+' '+phoneShow(m.phone)):t('destDefault');
        render();toast(t('toastWithdraw',{amt:fmt(mo.avail),dest:dest}));
      }
      break;
    }
    case 'add-product':openEditor(mgrStore().id,null);break;
    case 'edit-product':openEditor(d.sid,d.pid);break;
    case 'cancel-edit':state.edit=null;render();break;
    case 'pick-editor':photoFor='editor';el('photoInput').click();break;
    case 'pick-quick':photoFor={sid:d.sid,pid:d.pid};el('photoInput').click();break;
    case 'rm-photo-editor':
      if(state.edit){state.edit.photo=null;state.edit.removePhoto=true;render();}
      break;
    case 'stock':{
      var key=d.sid+'|'+d.pid;
      if(state.soldout[key])delete state.soldout[key];else state.soldout[key]=1;
      persist();render();break;
    }
    case 'del-product':{
      var k2='del:'+d.sid+'|'+d.pid;
      if(state.confirm!==k2){state.confirm=k2;render();break;}
      var s2=byId(d.sid);
      if(s2){s2.items=s2.items.filter(function(i){return !(i.id===d.pid&&i.c);});dropProductData(d.sid,d.pid);}
      state.confirm=null;persist();render();toast(t('toastRemoved'));break;
    }
    case 'remove-store':{
      var m3=mgrStore(),k3='rm:'+m3.id;
      if(state.confirm!==k3){state.confirm=k3;render();break;}
      state.confirm=null;removeStore(m3);break;
    }
    case 'view-in-shop':state.storeId=mgrStore().id;go('store');break;
    case 'open-dash':createStore();break;
    case 'edit-app':state.applied=null;render();break;
    case 'another':
      state.applied=null;
      state.form={store:'',owner:'',phone:'',net:'mpesa',cat:'general',area:'',about:'',wa:'',agree:false};
      render();break;
  }
});

function onField(e){
  var n=e.target;
  if(n.id==='q'){state.q=n.value;var l=el('storeList');if(l)l.innerHTML=storeList();return;}
  if(n.id==='b-name'){state.bName=n.value;return;}
  if(n.id==='b-area'){
    state.area=n.value;
    if(state.areaErr&&n.value.trim()){state.areaErr=false;var ae=n.parentNode.querySelector('.err');if(ae)ae.remove();}
    return;
  }
  if(n.id==='b-landmark'){state.landmark=n.value;return;}
  if(n.id==='phone'){state.phone=n.value;return;}
  if(n.id==='calcOrder'){state.calc.order=n.value;updateCalc();return;}
  if(n.id==='calcRate'){state.calc.rate=n.value;updateCalc();return;}
  if(n.id==='mgr'){
    if(e.type==='change'){state.mgr=n.value;state.edit=null;state.confirm=null;state.setErr=null;state.setDraft=null;render();}
    return;
  }
  if(n.dataset&&n.dataset.e&&state.edit){state.edit[n.dataset.e]=n.value;return;}
  if(n.dataset&&n.dataset.f){
    state.form[n.dataset.f]=(n.type==='checkbox')?n.checked:n.value;
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);

el('photoInput').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];
  e.target.value='';
  var target=photoFor;photoFor=null;
  if(!f||!target)return;
  toast(t('photoBusy'));
  resizeImage(f).then(function(blob){
    if(target==='editor'){
      if(!state.edit)return;
      state.edit.photo={blob:blob,url:URL.createObjectURL(blob)};
      state.edit.removePhoto=false;
      el('toast').hidden=true;
      render();
    }else{
      attachPhoto(target.sid+'|'+target.pid,blob);
    }
  },function(){toast(t('photoFail'));});
});

document.addEventListener('submit',function(e){
  if(e.target.id==='editForm'){e.preventDefault();saveEdit();return;}
  if(e.target.id!=='sellForm')return;
  e.preventDefault();
  var f=state.form,errs={};
  if(!f.store.trim())errs.store=t('required');
  if(!f.owner.trim())errs.owner=t('required');
  if(!normalizePhone(f.phone))errs.phone=t('phoneBad');
  if(f.wa.trim()&&!normalizePhone(f.wa))errs.wa=t('phoneBad');
  if(!f.area.trim())errs.area=t('required');
  if(!f.agree)errs.agree=t('agreeReq');
  var keys=['store','owner','phone','wa','area','agree'];
  keys.forEach(function(k){
    var n=el('err-'+k);
    if(n){n.hidden=!errs[k];n.textContent=errs[k]||'';}
  });
  var first=null;
  keys.forEach(function(k){if(!first&&errs[k])first=k;});
  if(first){var c=el('f-'+first);if(c)c.focus();return;}
  state.applied={store:f.store.trim(),phone:normalizePhone(f.phone),wa:f.wa.trim()?normalizePhone(f.wa):''};
  render();
});

if(WIDE.addEventListener)WIDE.addEventListener('change',function(){render();});
render();
initCloud();
})();
</script>
